name: Play Bundle
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name e.g. v1.0.0"
        required: true
        default: "v1.0.0"
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_KEYSTORE_SECRET: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ format('refs/tags/{0}', github.event.inputs.tag) }}
      - name: Remove stale files
        run: bash scripts/remove-stale-files.sh
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.7.1"
      - name: Decode keystore
        if: env.HAS_KEYSTORE_SECRET == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
      - name: Check FFmpeg is LGPL-only (no GPL or nonfree flags)
        run: |
          bash scripts/test-check-ffmpeg-license.sh
          bash scripts/check-ffmpeg-license.sh --source
      - name: Check lines and comments
        run: |
          bash scripts/check-lines.sh
          bash scripts/check-comments.sh
          bash scripts/check-binaries.sh
          bash scripts/check-function-lines.sh
          python3 scripts/check-contrast.py
      - name: Merge manifests
        run: gradle :app:processDebugMainManifest :app:processReleaseMainManifest --no-daemon
      - name: Check merged manifest
        run: bash scripts/check-merged-manifest.sh
      - name: Lint
        run: gradle :app:lintRelease --no-daemon
      - name: Unit tests
        run: gradle :engine:test :core:test :codecpack:test --no-daemon
      - name: Require signing configuration
        run: |
          test "${HAS_KEYSTORE:-}" = "true"
          test -n "${KEYSTORE_PASSWORD:-}"
          test -n "${KEY_ALIAS:-}"
          test -n "${KEY_PASSWORD:-}"
          test -n "${CERT_SHA256:-}"
        env:
          CERT_SHA256: ${{ secrets.PLAY_CERT_SHA256 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Check fonts
        run: bash scripts/check-fonts.sh
      - name: Install NDK and FFmpeg build tools
        run: |
          sdkmanager --install "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          sudo apt-get update && sudo apt-get install -y yasm nasm pkg-config meson ninja-build
      - name: Build LGPL FFmpeg into the app
        run: |
          bash scripts/build-ffmpeg.sh build/ffmpeg
          bash scripts/check-ffmpeg-license.sh --binaries codecpack/src/main/jniLibs
          mkdir -p codecpack/src/main/assets
          cp build/ffmpeg/src/ffmpeg/COPYING.LGPLv2.1 codecpack/src/main/assets/COPYING.LGPLv2.1
          cp build/ffmpeg/src/dav1d/COPYING codecpack/src/main/assets/COPYING.dav1d
          printf 'FFmpeg %s\nlibdav1d %s (static, BSD-2-Clause)\n' "$(cat build/ffmpeg/FFMPEG_VERSION.txt)" "$(cat build/ffmpeg/DAV1D_VERSION.txt)" > codecpack/src/main/assets/BUNDLED_VERSIONS.txt
      - name: Build signed Play bundle
        env:
          CERT_SHA256: ${{ secrets.PLAY_CERT_SHA256 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:bundleRelease -PstoreBuild=true --no-daemon
      - name: Collect bundle
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/*.aab dist/
          (cd dist && sha256sum *.aab > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frameout-play-bundle
          path: dist/*
