name: Generate Keystore
on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Replace the existing signing key (existing users will no longer be able to update)"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  keystore:
    runs-on: ubuntu-latest
    env:
      ADMIN_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
      BACKUP_PASSPHRASE: ${{ secrets.KEYSTORE_BACKUP_PASSPHRASE }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
      OVERWRITE: ${{ github.event.inputs.overwrite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Require admin token and backup passphrase
        run: |
          test -n "$ADMIN_TOKEN"
          test -n "$BACKUP_PASSPHRASE"
      - name: Refuse to replace an existing key
        run: |
          if gh secret list --json name --jq '.[].name' | grep -qx KEYSTORE_BASE64 && [ "$OVERWRITE" != "true" ]; then
            echo "::error title=Signing key exists::KEYSTORE_BASE64 is already set. Replacing it breaks updates for installed users. Re-run with overwrite enabled only if that is intended."
            exit 1
          fi
      - name: Generate keystore and encrypted backup
        run: |
          umask 077
          PASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)
          echo "::add-mask::$PASS"
          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore frameout.keystore \
            -alias frameout \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Frame out, OU=Mobile, O=Frame out, L=Unknown, ST=Unknown, C=US" > /dev/null
          base64 -w0 frameout.keystore > frameout.keystore.b64
          printf '%s' "$PASS" > frameout.pass
          tar -cf - frameout.keystore | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:BACKUP_PASSPHRASE -out keystore-backup.enc
          printf 'PASS=%s\n' "$PASS" | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:BACKUP_PASSPHRASE -out keystore-pass.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:BACKUP_PASSPHRASE -in keystore-backup.enc | tar -xOf - frameout.keystore | cmp - frameout.keystore
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:BACKUP_PASSPHRASE -in keystore-pass.enc | grep -qx "PASS=$PASS"
      - name: Upload encrypted backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keystore-encrypted
          path: |
            keystore-backup.enc
            keystore-pass.enc
          retention-days: 90
          if-no-files-found: error
      - name: Store secrets
        run: |
          PASS=$(cat frameout.pass)
          gh secret set KEYSTORE_BASE64 < frameout.keystore.b64
          printf '%s' "$PASS" | gh secret set KEYSTORE_PASSWORD
          printf '%s' "frameout" | gh secret set KEY_ALIAS
          printf '%s' "$PASS" | gh secret set KEY_PASSWORD
      - name: Remove plaintext key material
        if: always()
        run: shred -u frameout.keystore frameout.keystore.b64 frameout.pass 2>/dev/null || rm -f frameout.keystore frameout.keystore.b64 frameout.pass
