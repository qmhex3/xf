<title>Frame out Island Dock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one floating glass body at the bottom. A concave notch cradles the primary orb.
   The body, notch, orb and items all morph together between screens. */
:root{
  --page:#05060B; --bg:#0A0B12; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
  --ink:#ECEBF6; --ink2:#9796B0; --accent:#8B8DFF; --cyan:#3DDCFF; --violet:#A66BFF;
  --ok:#35D6A0; --err:#FF5D73;
  --bar-top:#262839; --bar-bot:#161723; --rim-a:rgba(255,255,255,.55); --rim-b:rgba(255,255,255,.05);
  --glass:rgba(22,23,35,.82); --shadow:rgba(0,0,0,.55); --halo:rgba(139,141,255,.26);
  --font:'IBM Plex Sans Arabic',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --spring:cubic-bezier(.3,1.4,.5,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
:root{color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --page:#E9E8F3; --bg:#F4F3FA; --card:rgba(20,20,60,.045); --line:rgba(20,20,60,.1);
  --ink:#171826; --ink2:#66667E; --accent:#5A5DE8; --cyan:#0A8FB8; --violet:#7C3AED;
  --ok:#0E9F6E; --err:#D92D4A; --bar-top:#FFFFFF; --bar-bot:#EFEDFA; --rim-a:rgba(255,255,255,1); --rim-b:rgba(90,93,232,.18);
  --glass:rgba(255,255,255,.86); --shadow:rgba(60,50,140,.28); --halo:rgba(90,93,232,.16); color-scheme:light}}
:root[data-theme="light"]{
  --page:#E9E8F3; --bg:#F4F3FA; --card:rgba(20,20,60,.045); --line:rgba(20,20,60,.1);
  --ink:#171826; --ink2:#66667E; --accent:#5A5DE8; --cyan:#0A8FB8; --violet:#7C3AED;
  --ok:#0E9F6E; --err:#D92D4A; --bar-top:#FFFFFF; --bar-bot:#EFEDFA; --rim-a:rgba(255,255,255,1); --rim-b:rgba(90,93,232,.18);
  --glass:rgba(255,255,255,.86); --shadow:rgba(60,50,140,.28); --halo:rgba(90,93,232,.16); color-scheme:light}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--page);color:var(--ink);font-family:var(--font);padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* harness */
.panel{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.panel-top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panel h1{font-size:14px;font-weight:700}
.panel p{font-size:11.5px;color:var(--ink2);line-height:1.6}
.row{display:flex;gap:6px;flex-wrap:wrap}
.pb{font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.pb.go{background:linear-gradient(135deg,var(--accent),var(--violet));color:#fff;border-color:transparent}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{font-size:11px;font-weight:500;padding:7px 4px;border-radius:10px;border:1px solid var(--line);color:var(--ink2);background:transparent;transition:.2s}
.chip.on{color:var(--ink);border-color:var(--accent);background:var(--halo)}

/* stage */
.stage{--bgs:var(--bg);width:100%;max-width:392px;height:730px;background:var(--bgs);border-radius:42px;position:relative;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 70px -20px var(--shadow);transition:background .45s}
.stage.dark-view{--bgs:#000}
.stage.dark-view .screen{--ink:#ECEBF6;--ink2:#9796B0;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);color:var(--ink)}
.screen{position:absolute;inset:0;overflow-y:auto;padding:30px 20px 170px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.swap{animation:swap .4s var(--spring)}
@keyframes swap{from{opacity:0;transform:translateY(10px) scale(.985)}}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.hd h2{font-size:22px;font-weight:700;letter-spacing:-.2px}
.hd small{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
.bk{width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;gap:13px;align-items:center;margin-bottom:11px;width:100%;text-align:start}
.th{width:66px;height:66px;border-radius:15px;flex:none;position:relative}
.th b{position:absolute;inset-inline-start:5px;bottom:5px;font:500 9.5px var(--mono);background:rgba(0,0,0,.6);color:#fff;border-radius:5px;padding:1px 5px}
.card h3{font:600 13.5px var(--mono);direction:ltr;text-align:start}
.card span{display:block;font-size:12px;color:var(--ink2);margin-top:3px}
.sw{margin-inline-start:auto;width:42px;height:25px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:19px;height:19px;border-radius:50%;background:var(--ink2);transition:.3s var(--spring)}
.sw.on{background:linear-gradient(135deg,var(--cyan),var(--accent))}
.sw.on::after{inset-inline-start:20px;background:#fff}
.sec{font-size:11.5px;color:var(--ink2);font-weight:600;letter-spacing:.3px;margin:6px 4px 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.fr{aspect-ratio:1;border-radius:16px;position:relative;border:2px solid transparent;transition:.25s var(--spring);overflow:hidden;display:block}
.fr i{position:absolute;inset-inline-start:7px;bottom:6px;font:500 10px var(--mono);color:#fff;text-shadow:0 1px 3px #000}
.fr .ck{position:absolute;top:6px;inset-inline-end:6px;width:23px;height:23px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:rgba(0,0,0,.25);display:grid;place-items:center;color:#fff;font-size:12px;transition:.25s var(--spring)}
.fr.s{border-color:var(--cyan);transform:scale(.94);box-shadow:0 0 22px -4px var(--cyan)}
.fr.s .ck{background:linear-gradient(135deg,var(--cyan),var(--accent));border-color:#fff}
.photo{width:100%;height:440px;border-radius:26px;position:relative;overflow:hidden;background:linear-gradient(180deg,#1b2a5c 0%,#8a5fb8 46%,#f2a07b 62%,#183a5a 62.4%,#0c2236 100%);transition:.5s var(--spring)}
.photo::before{content:"";position:absolute;width:86px;height:86px;border-radius:50%;left:50%;top:50%;margin:-70px 0 0 -43px;background:radial-gradient(#fff6d8,#ffc78a 60%,transparent 72%);box-shadow:0 0 70px 20px rgba(255,190,130,.5)}
.photo::after{content:"";position:absolute;left:0;right:0;top:62.4%;bottom:0;background:repeating-linear-gradient(180deg,rgba(255,200,150,.2) 0 2px,transparent 2px 9px);mask:linear-gradient(180deg,#000,transparent)}
.photo.dim{transform:scale(.92) translateY(-18px);filter:saturate(.85)}
.meta{display:flex;justify-content:space-between;font:500 11.5px var(--mono);color:var(--ink2);margin-top:12px;direction:ltr;padding-inline:4px}
.crop{position:absolute;inset:50px 38px 70px;border:1.5px solid #fff;border-radius:6px;box-shadow:0 0 0 999px rgba(0,0,0,.55);background:linear-gradient(#fff3 1px,transparent 1px) 0 33.3%/100% 33.3%,linear-gradient(90deg,#fff3 1px,transparent 1px) 33.3% 0/33.3% 100%}
.crop i{position:absolute;width:15px;height:15px;border:3px solid var(--cyan);border-radius:3px}
.crop i:nth-child(1){top:-3px;left:-3px;border-right:0;border-bottom:0}.crop i:nth-child(2){top:-3px;right:-3px;border-left:0;border-bottom:0}
.crop i:nth-child(3){bottom:-3px;left:-3px;border-right:0;border-top:0}.crop i:nth-child(4){bottom:-3px;right:-3px;border-left:0;border-top:0}
.pane{flex:1;aspect-ratio:3/4.4;border-radius:20px;position:relative}
.pane b{position:absolute;bottom:9px;left:0;right:0;text-align:center;font:600 11px var(--mono)}
.qcv{height:430px;border-radius:26px;position:relative;overflow:hidden;background:linear-gradient(160deg,#152a52,#5b3a8c 55%,#e08b6a)}
.qcv .tc{position:absolute;bottom:16px;left:0;right:0;text-align:center;font:700 26px var(--mono);color:#fff;text-shadow:0 2px 10px #0008}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
.flash.go{animation:fl .35s ease-out}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
.toast{position:absolute;top:18px;left:50%;transform:translate(-50%,-14px) scale(.9);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);padding:9px 16px;border-radius:99px;font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:.4s var(--spring);z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}

/* ===== ISLAND ===== */
.island{position:absolute;inset-inline:14px;bottom:20px;display:flex;flex-direction:column;align-items:center;z-index:30;pointer-events:none}
.island>*{pointer-events:auto}
.strip{width:100%;max-width:350px;height:0;opacity:0;transform:translateY(14px) scale(.93);overflow:hidden;border-radius:99px;background:var(--glass);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--line);box-shadow:0 14px 30px -10px var(--shadow);position:relative;display:flex;align-items:center;gap:9px;padding-inline:18px 6px;transition:height .5s var(--spring),opacity .3s,transform .5s var(--spring),margin .5s var(--spring);margin-bottom:0}
.strip.show{height:48px;opacity:1;transform:none;margin-bottom:14px}
.strip .t{font-size:12.5px;font-weight:600;white-space:nowrap}
.strip .n{font:600 11px var(--mono);color:var(--cyan);background:color-mix(in srgb,var(--cyan) 14%,transparent);padding:2px 8px;border-radius:8px;direction:ltr}
.strip .r{font-size:11px;color:var(--ink2);white-space:nowrap;margin-inline-end:auto;overflow:hidden;text-overflow:ellipsis}
.strip .a{font-size:12px;font-weight:600;padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);flex:none;margin-inline-start:auto}
.strip .pg{position:absolute;bottom:0;inset-inline:0;height:3px;background:var(--line)}
.strip .pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--cyan));box-shadow:0 0 10px var(--cyan);transition:width .25s linear}
.strip.bad .pg i{background:var(--err);box-shadow:0 0 10px var(--err)}
.strip.good .pg i{background:var(--ok);box-shadow:0 0 10px var(--ok)}

.tray{max-height:0;opacity:0;transform:translateY(16px) scale(.9);overflow:hidden;border-radius:26px;background:var(--glass);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--line);box-shadow:0 14px 30px -10px var(--shadow);display:flex;justify-content:center;gap:2px;padding-inline:8px;transition:max-height .5s var(--spring),opacity .3s,transform .5s var(--spring),margin .5s var(--spring),padding .5s var(--spring);margin-bottom:0}
.tray.show{max-height:84px;opacity:1;transform:none;margin-bottom:12px;padding-block:8px}
.tool{width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;padding-block:6px;border-radius:16px;color:var(--ink2);font-size:10.5px;font-weight:600;transition:.2s}
.tool:active{transform:scale(.9)}
.tool:hover{color:var(--ink);background:var(--card)}
.tool.on{color:var(--ink);background:var(--halo)}
.tray .rt{padding:9px 15px;border-radius:14px;font:600 12px var(--mono);color:var(--ink2);border:1px solid var(--line)}
.tray .rt.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--cyan))}
.tray.ratio{gap:7px}

.barwrap{position:relative;height:68px;margin-top:0;transition:margin .5s var(--spring)}
#shape{position:absolute;inset:0;overflow:visible;filter:drop-shadow(0 18px 22px var(--shadow))}
#track{position:absolute;inset:0}
.it{position:absolute;top:0;left:0;height:68px;transition:transform .6s var(--spring),width .6s var(--spring);color:var(--ink2)}
.it .in{display:flex;flex-direction:column;align-items:center;padding-top:11px;height:100%;position:relative}
.it.new .in{animation:pop .5s var(--spring) both}
.it.out{pointer-events:none}
.it.out .in{animation:gone .25s ease-in forwards}
@keyframes pop{from{opacity:0;transform:scale(.4) translateY(8px)}}
@keyframes gone{to{opacity:0;transform:scale(.4)}}
.it .in.swap svg{animation:ics .4s var(--spring)}
@keyframes ics{from{opacity:0;transform:rotate(-80deg) scale(.5)}}
.it:active .in{transform:scale(.88)}
.it .in{transition:transform .25s var(--spring),color .25s}
.ic{width:22px;height:22px;display:block;overflow:visible}
.ic .b{fill:currentColor;opacity:.2;stroke:none;transition:opacity .25s}
.ic .s{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[dir=rtl] .flipx{transform:scaleX(-1)}
.lb{font-style:normal;font-size:10.5px;font-weight:600;line-height:13px;margin-top:5px;white-space:nowrap;transition:color .25s}
.it.sel{color:var(--ink)}
.it.sel .ic{filter:drop-shadow(0 0 7px var(--accent))}
.it.sel .ic .b{opacity:.5;fill:var(--accent)}
.it.sel .lb{color:var(--accent)}
.it.danger{color:var(--err)}
.it.on .ic{color:var(--cyan);filter:drop-shadow(0 0 6px var(--cyan))}
.it.on .lb{color:var(--ink)}
.it.on .in::after{content:"";position:absolute;top:8px;inset-inline-end:calc(50% - 17px);width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.it.hot .in::before{content:"";position:absolute;top:6px;width:46px;height:32px;border-radius:16px;background:linear-gradient(135deg,var(--cyan),var(--accent) 55%,var(--violet));box-shadow:0 6px 16px -4px var(--accent),inset 0 1px 1px #fff9;transition:.4s var(--spring)}
.it.hot{color:#fff}
.it.hot .ic{position:relative;filter:none}
.it.hot .ic .b{opacity:.35;fill:#fff}
.it.hot .lb{color:var(--accent);font-weight:700}
#halo{position:absolute;top:6px;height:46px;left:0;border-radius:23px;background:radial-gradient(circle at 50% 30%,var(--halo),transparent 78%);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:0 0 18px -2px var(--halo),inset 0 1px 0 #fff4;opacity:0;transition:transform .6s var(--spring),width .6s var(--spring),opacity .3s}
#halo.show{opacity:1}

.fabpos{position:absolute;left:0;top:0;width:58px;height:58px;will-change:transform}
.aura{position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,var(--glow,var(--accent)) 0%,transparent 66%);opacity:.5;pointer-events:none;transition:opacity .4s}
.aura.run{animation:breath 2.2s ease-in-out infinite}
@keyframes breath{50%{opacity:.85;transform:scale(1.12)}}
.fab{position:absolute;inset:0;border-radius:21px;background:linear-gradient(140deg,#14c8e8 0%,#5b5df0 52%,#a35cf0 100%);border:1px solid rgba(255,255,255,.4);box-shadow:0 12px 26px -6px var(--accent),inset 0 1.5px 1px rgba(255,255,255,.55);color:#fff;display:grid;place-items:center;overflow:hidden;transition:border-radius .55s var(--spring),background .4s,box-shadow .4s,transform .25s var(--spring)}
.fab:active{transform:scale(.9)}
.fab::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.04) 48%,rgba(0,0,0,.14));pointer-events:none}
.fab .ic{width:26px;height:26px;position:relative;z-index:3;filter:drop-shadow(0 2px 4px #0005)}
.fab .ic .b{opacity:.28;fill:#fff}
.fab .ic.sw2{animation:ics .45s var(--spring)}
.fab.run,.fab.pau,.fab.ok,.fab.err,.fab.spin{border-radius:50%}
.liq{position:absolute;inset:0;opacity:0;transition:opacity .3s;z-index:1;overflow:hidden;border-radius:inherit}
.fab.run .liq,.fab.pau .liq{opacity:1}
.liq .lv{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p,0)*1%);background:linear-gradient(180deg,#20e0f5,#4f55ee);transition:height .3s linear}
.liq svg{position:absolute;top:-9px;left:0;width:200%;height:10px;fill:#20e0f5;animation:wv 2s linear infinite}
.fab.pau .liq svg{animation-play-state:paused}
@keyframes wv{to{transform:translateX(-50%)}}
.fab.run,.fab.pau{background:linear-gradient(140deg,#2a2d57,#1b1c3a)}
.fab.pau{filter:saturate(.7)}
.fab.ok{background:linear-gradient(140deg,#14d9a3,#0ea5d7);animation:okpop .5s var(--spring)}
@keyframes okpop{0%{transform:scale(.8)}50%{transform:scale(1.14)}}
.fab.err{background:linear-gradient(140deg,#ff8a5d,#e5304f);animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.fab.spin::before{content:"";position:absolute;inset:4px;border-radius:50%;border:2.5px solid rgba(255,255,255,.22);border-top-color:#fff;animation:rot .8s linear infinite;z-index:4}
@keyframes rot{to{transform:rotate(360deg)}}
.fab .bd{position:absolute;top:3px;inset-inline-end:3px;min-width:19px;height:19px;border-radius:10px;background:#fff;color:#4a3dd8;font:700 10.5px/19px var(--mono);text-align:center;padding-inline:4px;z-index:5;transform:scale(0);transition:transform .4s var(--spring)}
.fab .bd.show{transform:scale(1)}
.fablb{position:absolute;left:0;top:38px;width:96px;margin-left:-48px;text-align:center;font-style:normal;font-size:10.5px;font-weight:700;line-height:13px;color:var(--ink);white-space:nowrap;pointer-events:none;transition:opacity .3s}
.fablb em{font:600 10px var(--mono);font-style:normal;color:var(--cyan)}
.home{position:absolute;bottom:6px;left:50%;width:120px;margin-left:-60px;height:4px;border-radius:3px;background:var(--ink);opacity:.22;z-index:40}
.note{font-size:11.5px;color:var(--ink2);line-height:1.7;max-width:440px;text-align:center}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<aside class="panel">
  <div class="panel-top">
    <h1>جزيرة Frame out السفلية</h1>
    <div class="row">
      <button class="pb" id="themeBtn">فاتح / داكن</button>
      <button class="pb" id="dirBtn">RTL / LTR</button>
      <button class="pb go" id="flowBtn">تشغيل التدفق</button>
    </div>
  </div>
  <nav class="chips" id="chips" aria-label="الحالات"></nav>
  <p>جرّب الأزرار مباشرة داخل الهاتف. الشريط واحد في كل الشاشات: يتحول بدل أن يُستبدل.</p>
</aside>

<main class="stage" id="stage">
  <section class="screen" id="screen"></section>
  <div class="toast" id="toast"></div>
  <div class="flash" id="flash"></div>
  <div class="island" id="island">
    <div class="strip" id="strip"><span class="t" id="sT"></span><span class="n" id="sN"></span><span class="r" id="sR"></span><button class="a" id="sA"></button><div class="pg"><i id="sP"></i></div></div>
    <div class="tray" id="tray"></div>
    <div class="barwrap" id="bar">
      <svg id="shape" aria-hidden="true">
        <defs>
          <linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--bar-top)"/><stop offset="1" style="stop-color:var(--bar-bot)"/></linearGradient>
          <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--rim-a)"/><stop offset="1" style="stop-color:var(--rim-b)"/></linearGradient>
        </defs>
        <path id="pf" fill="url(#gf)" fill-opacity=".97"/>
        <path id="pr" fill="none" stroke="url(#gr)" stroke-width="1.2"/>
      </svg>
      <div id="halo"></div>
      <div id="track"></div>
      <div class="fabpos" id="fabpos">
        <div class="aura" id="aura"></div>
        <button class="fab" id="fab"><span class="liq"><span class="lv"></span><svg viewBox="0 0 120 10" preserveAspectRatio="none"><path d="M0 5C15 10 30 0 45 5S75 10 90 5 105 0 120 5V10H0z"/></svg></span><span id="fi" style="display:grid;place-items:center"></span><span class="bd" id="bd"></span></button>
      </div>
      <i class="fablb" id="fablb"></i>
    </div>
  </div>
  <div class="home"></div>
</main>

<script>

function go(key,opt={}){
  if(key==='ext'&&(prog>=100||cur==='err'||cur==='lib'||cur==='set')&&cur!=='pau')prog=cur==='err'?10:0;
  if(S[key].screen!==S[cur].screen&&opt.push!==false)hist.push(cur);
  render(key);
}
function goBack(){const k=hist.pop();render(k||'lib',{force:true})}
let toastT=0;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),1900)}
function flash(){const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}

/* ---------- interactions ---------- */
function act(id){
  switch(id){
    case 'library':return go('lib');
    case 'settings':return go('set');
    case 'selectAll':if(picked.size>=12)picked.clear();else picked=new Set([...Array(12).keys()]);return go(picked.size?'frs':'fr',{push:false}),render(picked.size?'frs':'fr',{force:true});
    case 'save':return toast('حُفظ الإطار في المعرض');
    case 'lens':return toast('العدسة: تكبير الإطار');
    case 'edit':return go(cur==='tools'?'view':'tools');
    case 'trash':return toast('نُقل الإطار إلى المحذوفات');
    case 'collage':return go('col');
    case 'compare':return go('cmp');
    case 'more':return toast('المزيد: مشاركة، GIF، PDF، ZIP');
    case 'cancel':return go('view');
    case 'reset':return toast('أُعيد ضبط القص');
    case 'tpl':return toast('القالب التالي');
    case 'gap':return toast('المسافة بين الإطارات');
    case 'fmt':case 'ts':flags[id]=!flags[id];return render(cur,{force:true});
    case 'cmpinfo':return toast('الفرق بين الإطارين: 6.7 ثانية');
    case 'back':case 'fwd':frameNo+=id==='fwd'?1:-1;$('#tc').textContent='#'+frameNo;return;
  }
}
function fabAct(){
  switch(cur){
    case 'lib':case 'set':toast('اختر فيديو لبدء الاستخراج');return setTimeout(()=>go('ext'),500);
    case 'ext':return go('pau');
    case 'pau':return go('ext');
    case 'err':return go('ext');
    case 'ok':return go('lib');
    case 'frs':toast(`حُفظ ${picked.size} إطار في المعرض`);picked.clear();return render('fr',{force:true});
    case 'crop':toast('طُبّق القص');return go('view');
    case 'col':case 'cmp':{const s=S[cur];s.fab.mode='spin';syncFab(s);const k=cur;setTimeout(()=>{s.fab.mode='ok';s.fab.icon='check';if(cur===k)syncFab(s);toast('حُفظ في المعرض');setTimeout(()=>{s.fab.mode='idle';s.fab.icon='save';fabSig='';if(cur===k)syncFab(s)},1300)},1300);return}
    case 'qc':flash();frameNo++;$('#tc').textContent='#'+frameNo;return toast('التُقط الإطار');
  }
}
track.addEventListener('click',e=>{const b=e.target.closest('.it');if(b&&!b.classList.contains('out'))act(b.dataset.id)});
fab.addEventListener('click',fabAct);
$('#sA').addEventListener('click',()=>{if(cur==='ext'||cur==='pau'){prog=0;go('lib')}else go('lib')});
$('#tray').addEventListener('click',e=>{
  const t=e.target.closest('[data-tool]');if(t){if(t.dataset.tool==='crop')go('crop');else toast('أداة: '+t.textContent.trim());return}
  const r=e.target.closest('[data-ratio]');if(r){document.querySelectorAll('.rt').forEach(x=>x.classList.toggle('on',x===r))}
});
$('#screen').addEventListener('click',e=>{
  if(e.target.closest('[data-back]'))return goBack();
  const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);
  const ck=e.target.closest('[data-ck]');
  if(ck){const i=+ck.dataset.ck;picked.has(i)?picked.delete(i):picked.add(i);return render(picked.size?'frs':'fr',{force:true})}
  const f=e.target.closest('[data-fr]');if(f){frameNo=1200+ +f.dataset.fr;go('view')}
});
$('#chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;stopFlow();const k=c.dataset.k;if(k==='frs'&&!picked.size)picked=new Set([0,2,5]);if(k==='fr'&&picked.size&&cur!=='frs')picked.clear();go(k,{push:false})});
$('#themeBtn').addEventListener('click',()=>{const dark=getComputedStyle(root).getPropertyValue('--ink').trim().toLowerCase()==='#ecebf6';root.dataset.theme=dark?'light':'dark'});
$('#dirBtn').addEventListener('click',()=>{rtl=!rtl;root.dir=rtl?'rtl':'ltr';render(cur,{force:true})});
addEventListener('resize',()=>render(cur));

/* ---------- guided flow ---------- */
let flowT=0,flowOn=false;
const FLOW=[['lib',1500],['ext',2600],['pau',1500],['ext',1200],['ok',2600],['set',1600],['fr',1500],['frs',1700],['view',1700],['tools',2000],['crop',2000],['view',1000],['col',1800],['cmp',1700],['qc',1800],['lib',1200]];
function stopFlow(){flowOn=false;clearTimeout(flowT);$('#flowBtn').textContent='تشغيل التدفق'}
$('#flowBtn').addEventListener('click',()=>{
  if(flowOn)return stopFlow(); flowOn=true;$('#flowBtn').textContent='إيقاف التدفق';let i=0;
  const step=()=>{if(!flowOn)return;const [k,d]=FLOW[i%FLOW.length];if(k==='frs'&&!picked.size)picked=new Set([0,2,5]);if(k==='fr')picked.clear();go(k,{push:false});i++;flowT=setTimeout(step,d)};step();
});
render('lib',{force:true});
</script>
